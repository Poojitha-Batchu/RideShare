<div class="forgot-page">
    <div class="forgot-container">
        <h2>Reset Password</h2>

        <app-message
                [successMessage]="forgotPasswordSuccessMessage"
                [errorMessage]="forgotPasswordErrorMessage">
        </app-message>

        <form [formGroup]="forgotPasswordForm" (ngSubmit)="resetPassword()">
            <!-- Email -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" formControlName="email" placeholder="Enter email" />

                <div class="error" *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
                        <small *ngIf="forgotPasswordForm.get('email')?.errors?.['required']"> Email is required </small>
                        <small *ngIf="forgotPasswordForm.get('email')?.errors?.['email']"> Invalid email format </small>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label>New Password</label>
                <input type="password" formControlName="password" placeholder="Enter new password" />

                <div class="password-rules">
                        <p [class.valid]="forgotPasswordForm.get('password')?.value?.length >= 8"> ✓ At least 8 characters </p>
                        <p [class.valid]="forgotPasswordForm.get('password')?.value?.match('[A-Z]')"> ✓ One uppercase letter</p>
                        <p [class.valid]="forgotPasswordForm.get('password')?.value?.match('[0-9]')"> ✓ One number </p>
                        <p [class.valid]=" forgotPasswordForm.get('password')?.value?.match('[!@#$%^&*(),.?:{}|<>]')"> ✓ One special character</p>
                </div>

                <div class="error"
                    *ngIf="forgotPasswordForm.get('password')?.invalid && forgotPasswordForm.get('password')?.touched">
                    <small *ngIf="forgotPasswordForm.get('password')?.errors?.['required']">
                        Password is required
                    </small>
                    <small *ngIf="forgotPasswordForm.get('password')?.errors?.['minlength']">
                        Minimum 8 characters required
                    </small>
                    <small *ngIf="forgotPasswordForm.get('password')?.errors?.['pattern']">
                        Password must contain uppercase, number, and special character
                    </small>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" formControlName="confirm_password" placeholder="Confirm password" />

                <div class="error"
                    *ngIf="forgotPasswordForm.get('confirm_password')?.invalid && forgotPasswordForm.get('confirm_password')?.touched">
                    <small *ngIf="forgotPasswordForm.get('confirm_password')?.errors?.['required']">
                        Confirm password is required
                    </small>
                </div>
            </div>

            <button type="submit" [disabled]="forgotPasswordForm.invalid">
                Reset Password
            </button>

        </form>
    </div>
</div>
