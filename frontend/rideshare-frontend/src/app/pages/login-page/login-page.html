<div class="login-page">
    <!-- Left Section -->

    <div class="left-section">
        <img src="assets/images/logo.png" alt="RideShare" />
        <h1>RideShare</h1>
        <h2>A Carpooling Platform</h2>
        <p>Share rides, save money and travel together safely.</p>
    </div>

    <!-- Right Section -->

    <div class="right-section">
        <div class="login-container">
            <h2>Welcome Back</h2>
            <p>Login to continue</p>

            <app-message
                [successMessage]="loginSuccessMessage"
                [errorMessage]="loginErrorMessage">
            </app-message>

            <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
                <!-- Email -->

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Enter email" formControlName="email" />
                    <div class="error" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                        <small *ngIf="loginForm.get('email')?.errors?.['required']"> Email is required </small>
                        <small *ngIf="loginForm.get('email')?.errors?.['email']"> Invalid email format </small>
                    </div>
                </div>

                <!-- Password -->

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter password" formControlName="password"
                        autocomplete="current-password" />
                    <div class="error" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                        <small *ngIf="loginForm.get('password')?.errors?.['required']">
                            Password is required
                        </small>
                    </div>
                </div>

                <div class="forgot-password">
                    <a routerLink="/forgot-password">
                        Forgot Password?
                    </a>
                </div>

                <button type="submit">Login</button>
            </form>

            <div class="signup-link">
                Don't have an account?

                <a routerLink="/signup">
                    <span>Sign Up</span>
                </a>
            </div>
        </div>
    </div>
</div>
