name: GCP Deploy

on:
  push:
    branches:
      - gcp-deploy
  workflow_dispatch:

jobs:
  build-backend-and-deploy:
    name: Build backend image and deploy to Cloud Run
    runs-on: ubuntu-latest
    # Map the step output to a job output variable
    outputs:
      backend_url: ${{ steps.get-url.outputs.BACKEND_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Build backend Docker image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/rideshare-backend:latest ./backend

      - name: Push backend image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/rideshare-backend:latest

      - name: Deploy backend to Cloud Run
        env:
          CLOUD_SQL_CONN: ${{ secrets.CLOUD_SQL_CONNECTION_NAME }}
          DB_NAME_VAL: ${{ secrets.DB_NAME }}
          DB_USER_VAL: ${{ secrets.DB_USER }}
          DB_PASSWORD_VAL: ${{ secrets.DB_PASSWORD }}
          DJANGO_SECRET_VAL: ${{ secrets.DJANGO_SECRET_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          cat > /tmp/backend-env.yaml << YAMLEOF
          CLOUD_SQL_CONNECTION_NAME: ${CLOUD_SQL_CONN}
          DB_NAME: ${DB_NAME_VAL}
          DB_USER: ${DB_USER_VAL}
          DB_PASSWORD: ${DB_PASSWORD_VAL}
          DJANGO_SECRET_KEY: ${DJANGO_SECRET_VAL}
          CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS}
          YAMLEOF
          gcloud run deploy rideshare-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/rideshare-backend:latest \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances "${CLOUD_SQL_CONN}" \
            --service-account=github-actions-runner@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --env-vars-file /tmp/backend-env.yaml

      - name: Get backend URL
        id: get-url
        run: |
          # Fetch URL and set it as an explicit step output
          URL=$(gcloud run services describe rideshare-backend --region=${{ secrets.GCP_REGION }} --platform=managed --format='value(status.url)')
          echo "BACKEND_URL=$URL" >> $GITHUB_OUTPUT

  build-frontend-and-deploy:
    name: Build frontend image and deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-backend-and-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Build frontend Docker image
        run: |
          docker build --no-cache \
            --build-arg API_BASE_URL=${{ needs.build-backend-and-deploy.outputs.backend_url }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/rideshare-frontend:latest ./frontend/rideshare-frontend

      - name: Push frontend image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/rideshare-frontend:latest

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy rideshare-frontend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/rideshare-frontend:latest \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --service-account=github-actions-runner@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars "API_BASE_URL=${{ needs.build-backend-and-deploy.outputs.backend_url }}"