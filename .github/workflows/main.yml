name: GCP Deploy

on:
  push:
    branches:
      - gcp-deploy
  workflow_dispatch:

jobs:
  build-backend-and-deploy:
    name: Build backend image and deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker us-docker.pkg.dev --quiet

      - name: Build backend Docker image
        run: |
          docker build -t us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rideshare-images/rideshare-backend:latest ./backend

      - name: Push backend image
        run: |
          docker push us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rideshare-images/rideshare-backend:latest

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy rideshare-backend \
            --image us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rideshare-images/rideshare-backend:latest \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --set-env-vars "CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME }},DB_NAME=${{ secrets.DB_NAME }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }},CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}"

      - name: Get backend URL
        run: |
          echo "BACKEND_URL=$(gcloud run services describe rideshare-backend --region=${{ secrets.GCP_REGION }} --platform=managed --format='value(status.url)')" >> $GITHUB_ENV

  build-frontend-and-deploy:
    name: Build frontend image and deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-backend-and-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: ./frontend/rideshare-frontend
        run: npm ci

      - name: Build frontend Docker image
        run: |
          docker build -t us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rideshare-images/rideshare-frontend:latest ./frontend/rideshare-frontend

      - name: Push frontend image
        run: |
          docker push us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rideshare-images/rideshare-frontend:latest

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy rideshare-frontend \
            --image us-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rideshare-images/rideshare-frontend:latest \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "API_BASE_URL=${{ env.BACKEND_URL }}"