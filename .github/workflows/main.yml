name: GCP Deploy

on:
  push:
    branches:
      - gcp-deploy
  workflow_dispatch:

jobs:
  build-backend-and-deploy:
    name: Build backend image and deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Build backend Docker image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/rideshare-backend:latest ./backend

      - name: Push backend image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/rideshare-backend:latest

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy rideshare-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/rideshare-backend:latest \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --add-cloudsql-instances ${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --set-env-vars CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME }},DB_NAME=${{ secrets.DB_NAME }},DB_USER=${{ secrets.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }},CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}

      - name: Get backend URL
        run: |
          echo "BACKEND_URL=$(gcloud run services describe rideshare-backend --region=${{ secrets.GCP_REGION }} --platform=managed --format='value(status.url)')" >> $GITHUB_ENV

  build-frontend-and-deploy:
    name: Build frontend image and deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-backend-and-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker gcr.io --quiet

      - name: Build frontend Docker image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/rideshare-frontend:latest ./frontend/rideshare-frontend

      - name: Push frontend image
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/rideshare-frontend:latest

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy rideshare-frontend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/rideshare-frontend:latest \
            --region ${{ secrets.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "API_BASE_URL=${{ env.BACKEND_URL }}"